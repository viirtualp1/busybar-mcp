name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Plugin is up to date
        run: git diff --exit-code -- plugin .claude-plugin ':!plugin/.claude-plugin/icon.png' || (echo '::error::plugin/ is stale: run npm run build and commit' && exit 1)
      - run: BUSYBAR_DRY_RUN=1 npm run smoke
